services:
  - type: web
    name: headfund
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      # Persist SQLite on the dashboard-mounted disk (do not add a disk block here).
      - key: DATABASE_PATH
        value: /var/data/crowdfund.db
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        value: yacov@drori.org
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        value: support@headfund.co.il
