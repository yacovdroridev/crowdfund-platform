{% extends 'base.html' %}
{% block title %}כניסה לחשבון | HeadFund{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto"><i data-lucide="shield-check" class="w-7 h-7 text-emerald-400"></i></div>
      <h1 class="text-2xl font-black text-slate-900">כניסה לחשבון</h1>
      <p class="text-xs text-slate-600">כניסה מאובטחת באמצעות אימייל וסיסמה</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <div><label class="block text-xs font-bold text-slate-700 mb-2">כתובת אימייל</label><input type="email" id="email" name="email" dir="ltr" autocomplete="email" required autofocus class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
      <div><label class="block text-xs font-bold text-slate-700 mb-2">סיסמה</label><input type="password" id="password" name="password" autocomplete="current-password" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"></div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold shadow-md hover:shadow-lg transition-all">התחברות למערכת</button>
    </form>
    <p class="text-center text-xs text-slate-600">אין לך חשבון? <a href="{{ url_for('register') }}" class="font-bold text-emerald-700">להרשמה</a></p>

    <!-- Quick Demo Accounts -->
    <div class="mt-6 pt-6 border-t border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
          <i data-lucide="key-round" class="w-4 h-4 text-emerald-600"></i>
          <span>חשבונות הדגמה (Basic Accounts)</span>
        </span>
        <span class="text-[10px] text-slate-600">לחץ למילוי מהיר</span>
      </div>
      <div class="grid grid-cols-1 gap-2.5">
        <button type="button" onclick="fillDemo('yacov@drori.org', 'Admin123456!')" class="w-full p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50/70 border border-slate-200 hover:border-emerald-300 transition-all text-right group">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold text-slate-900 group-hover:text-emerald-700">חשבון מנהל (Admin)</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-amber-100 text-amber-800 border border-amber-200">Admin</span>
          </div>
          <div class="text-[11px] text-slate-500 font-mono flex items-center justify-between dir-ltr">
            <span class="font-semibold text-slate-700">yacov@drori.org</span>
            <span class="text-slate-400">Admin123456!</span>
          </div>
        </button>

        <button type="button" onclick="fillDemo('demo@example.com', 'User123456!')" class="w-full p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50/70 border border-slate-200 hover:border-emerald-300 transition-all text-right group">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold text-slate-900 group-hover:text-emerald-700">חשבון יוצר (Creator)</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-slate-200 text-slate-700 border border-slate-300">User</span>
          </div>
          <div class="text-[11px] text-slate-500 font-mono flex items-center justify-between dir-ltr">
            <span class="font-semibold text-slate-700">demo@example.com</span>
            <span class="text-slate-400">User123456!</span>
          </div>
        </button>

        <button type="button" onclick="fillDemo('backer@example.com', 'User123456!')" class="w-full p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50/70 border border-slate-200 hover:border-emerald-300 transition-all text-right group">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold text-slate-900 group-hover:text-emerald-700">חשבון תומך (Backer)</span>
            <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-teal-100 text-teal-800 border border-teal-200">User</span>
          </div>
          <div class="text-[11px] text-slate-500 font-mono flex items-center justify-between dir-ltr">
            <span class="font-semibold text-slate-700">backer@example.com</span>
            <span class="text-slate-400">User123456!</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</section>

{% block scripts %}
<script>
  function fillDemo(email, password) {
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    if (emailInput && passInput) {
      emailInput.value = email;
      passInput.value = password;
      emailInput.focus();
    }
  }
</script>
{% endblock %}
{% endblock %}
