{% extends 'base.html' %}
{% block title %}כניסה לחשבון | HeadFund{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto"><i data-lucide="shield-check" class="w-7 h-7 text-emerald-400"></i></div>
      <h1 class="text-2xl font-black text-slate-900">כניסה לחשבון</h1>
      <p class="text-xs text-slate-600">כניסה מאובטחת באמצעות אימייל וסיסמה</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <div><label class="block text-xs font-bold text-slate-700 mb-2">כתובת אימייל</label><input type="email" name="email" dir="ltr" autocomplete="email" required autofocus class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
      <div><label class="block text-xs font-bold text-slate-700 mb-2">סיסמה</label><input type="password" name="password" autocomplete="current-password" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono"></div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold">התחברות למערכת</button>
    </form>
    <p class="text-center text-xs text-slate-600">אין לך חשבון? <a href="{{ url_for('register') }}" class="font-bold text-emerald-700">להרשמה</a></p>
  </div>
</section>
{% endblock %}
