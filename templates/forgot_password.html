{% extends 'base.html' %}
{% block title %}שכחתי סיסמה | HeadFund{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="key-round" class="w-7 h-7 text-emerald-400"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900">שכחתי סיסמה</h1>
      <p class="text-xs text-slate-600">הזינו את כתובת האימייל של החשבון. אם היא קיימת אצלנו, נשלח קישור לאיפוס.</p>
    </div>
    <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">כתובת אימייל</label>
        <input type="email" name="email" dir="ltr" autocomplete="email" required autofocus class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold shadow-md">שליחת קישור לאימייל</button>
    </form>
    <p class="text-center text-xs text-slate-600"><a href="{{ url_for('login') }}" class="font-bold text-emerald-700">חזרה לכניסה</a></p>
  </div>
</section>
{% endblock %}
