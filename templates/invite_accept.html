{% extends 'base.html' %}
{% block title %}השלמת הזמנה | HeadFund{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="mail-check" class="w-7 h-7 text-emerald-400"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900">השלמת הזמנה</h1>
      <p class="text-xs text-slate-600">שלום {{ invite_user.full_name }}, הגדירו סיסמה לחשבון <span class="font-mono" dir="ltr">{{ invite_user.email }}</span></p>
    </div>
    <form method="POST" action="{{ url_for('accept_invite', token=token) }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">סיסמה חדשה</label>
        <input type="password" name="password" required autocomplete="new-password" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
        <p class="text-[11px] text-slate-500 mt-1">לפחות 8 תווים, אות גדולה, אות קטנה, מספר וסימן.</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">אימות סיסמה</label>
        <input type="password" name="password_confirm" required autocomplete="new-password" class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 focus:outline-none font-mono">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold shadow-md">שמירת סיסמה וכניסה</button>
    </form>
  </div>
</section>
{% endblock %}
