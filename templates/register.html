{% extends 'base.html' %}
{% block title %}הרשמה | HeadFund{% endblock %}
{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-lg bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div>
      <h1 class="text-2xl font-black text-slate-900 mb-2">יצירת חשבון</h1>
      <p class="text-sm text-slate-500">החשבון נדרש לפתיחת פרויקט ולניהולו.</p>
    </div>
    {% include '_google_sso.html' %}
    <form method="POST" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div><label class="block text-xs font-bold mb-1">שם מלא *</label><input name="full_name" required autocomplete="name" class="w-full p-3 rounded-xl border border-slate-300"></div>
      <div><label class="block text-xs font-bold mb-1">אימייל *</label><input type="email" name="email" required dir="ltr" autocomplete="email" class="w-full p-3 rounded-xl border border-slate-300"></div>
      <div><label class="block text-xs font-bold mb-1">טלפון</label><input type="tel" name="phone" dir="ltr" autocomplete="tel" class="w-full p-3 rounded-xl border border-slate-300"></div>
      <div><label class="block text-xs font-bold mb-1">סיסמה *</label><input type="password" name="password" required minlength="12" autocomplete="new-password" class="w-full p-3 rounded-xl border border-slate-300 font-mono"><p class="text-[11px] text-slate-500 mt-1">לפחות 12 תווים, אות גדולה וקטנה, מספר וסימן.</p></div>
      <div><label class="block text-xs font-bold mb-1">אימות סיסמה *</label><input type="password" name="password_confirm" required minlength="12" autocomplete="new-password" class="w-full p-3 rounded-xl border border-slate-300 font-mono"></div>
      <label class="flex items-start gap-2 text-xs text-slate-600"><input type="checkbox" name="legal_accept" required class="mt-1"><span>קראתי ואני מסכים/ה ל<a href="{{ url_for('legal_document', document='terms') }}" class="text-emerald-700 font-bold">תנאי השימוש</a> ול<a href="{{ url_for('legal_document', document='privacy') }}" class="text-emerald-700 font-bold">מדיניות הפרטיות</a>.</span></label>
      <button class="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-bold">יצירת חשבון</button>
    </form>
  </div>
</section>
{% endblock %}
